<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/ikona.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<title>Truck Panel · start</title>
<style>
  :root { --tlo: #121212; --plyta: #1c1c1c; --rama: #2f2f2f; --rama-jasna: #3d3d3d; --akcent: #d0742f; --tekst: #ecebe8;
          --tekst-szary: #9a9893; --zielony: #3ddc6f; --czerwony: #ff4438; --zolty: #ffcc33;
          --font: "Barlow Semi Condensed", "Segoe UI", sans-serif; --liczby: "Saira Condensed", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 15% -10%, rgba(208,116,47,.13), transparent 55%), var(--tlo);
         color: var(--tekst); font: 500 18px/1.45 var(--font); }
  .tasma { height: 4px; opacity: .7; background: repeating-linear-gradient(-45deg, var(--zolty) 0 10px, #141414 10px 20px); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 40px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  h1 { margin: 0; font: 800 34px/1 var(--liczby); letter-spacing: 2px; text-transform: uppercase; }
  h1 span { display: block; font: 600 12px var(--font); letter-spacing: 3.5px; color: var(--akcent); margin-top: 4px; }
  .wybor { margin-left: auto; display: flex; border: 1px solid var(--rama-jasna); border-radius: 8px; overflow: hidden; }
  .wybor button { font: 700 15px var(--font); color: var(--tekst-szary); background: var(--plyta); border: 0; padding: 8px 14px; cursor: pointer; }
  .wybor button.aktywna { color: #111; background: var(--akcent); }
  .uklad { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  @media (max-width: 760px) { .uklad { grid-template-columns: 1fr; } }
  .kafel { background: var(--plyta); border: 1px solid var(--rama); border-top: 3px solid var(--rama-jasna); border-radius: 12px; padding: 18px; }
  .kafel.qr { border-top-color: var(--akcent); text-align: center; }
  h2 { margin: 0 0 10px; font: 600 13px var(--font); letter-spacing: 2.5px; text-transform: uppercase; color: var(--tekst-szary); }
  #qr { background: #fff; border-radius: 10px; padding: 12px; display: inline-block; line-height: 0; }
  #qr svg { width: 240px; height: 240px; }
  .adres { font: 700 24px var(--liczby); margin-top: 12px; word-break: break-all; user-select: all; }
  .male { color: var(--tekst-szary); font-size: 15px; }
  ol { margin: 0; padding-left: 22px; } li { margin: 6px 0; }
  .wiersz { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rama); }
  .wiersz:first-of-type { border-top: 0; }
  .wiersz .nazwa { flex: 1; }
  .znacznik { font: 700 13px var(--font); letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  .ok { background: color-mix(in srgb, var(--zielony) 20%, transparent); color: var(--zielony); }
  .zle { background: color-mix(in srgb, var(--czerwony) 18%, transparent); color: var(--czerwony); }
  .szare { background: #2a2a2a; color: var(--tekst-szary); }
  button.akcja { font: 700 15px var(--font); letter-spacing: 1px; text-transform: uppercase; color: #111; background: var(--akcent);
                 border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
  button.akcja:disabled { opacity: .5; cursor: default; }
  .komunikat { color: var(--zolty); font-size: 15px; min-height: 1.4em; margin-top: 6px; }
  .stopka { margin-top: 22px; color: var(--tekst-szary); font-size: 14px; }
  a { color: var(--akcent); }
</style>
</head>
<body>
<div class="tasma"></div>
<div class="wrap">
  <header>
    <h1>Truck Panel<span>ETS 2 · ATS</span></h1>
    <div class="wybor" id="jezyki"><button data-j="pl">PL</button><button data-j="en">EN</button></div>
  </header>
  <div class="uklad">
    <div class="kafel qr">
      <h2 data-t="zeskanuj"></h2>
      <div id="qr"></div>
      <div class="adres" id="adres">…</div>
      <p class="male" data-t="ta_sama_siec"></p>
      <p class="male"><span data-t="usb"></span> <b>http://localhost:<span id="port"></span></b></p>
    </div>
    <div>
      <div class="kafel">
        <h2 data-t="przygotowanie"></h2>
        <div id="gry"></div>
        <div class="wiersz">
          <div class="nazwa"><b data-t="zapora"></b><div class="male" data-t="zapora_opis"></div></div>
          <span id="zapora"></span>
        </div>
        <div class="komunikat" id="komunikat"></div>
      </div>
      <div class="kafel" style="margin-top:16px">
        <h2 data-t="jak"></h2>
        <ol id="kroki"></ol>
      </div>
    </div>
  </div>
  <p class="stopka"><span id="wersja"></span> · Garaż Kuby</p>
</div>
<script src="/qrcode.min.js"></script>
<script>
const TEKSTY = {
  pl: {
    zeskanuj: "Zeskanuj telefonem", ta_sama_siec: "Telefon lub tablet musi być w tej samej sieci Wi-Fi co komputer.",
    usb: "Po kablu USB (debugowanie USB włączone):", przygotowanie: "Przygotowanie", zapora: "Zapora Windows",
    zapora_opis: "Wpuszcza telefon z sieci domowej. Bez tego Windows często blokuje połączenie.",
    jest: "gotowe", brak: "brak", dodaj: "Dodaj regułę", zainstaluj: "Zainstaluj", nie_ma_gry: "nie znaleziono", wtyczka: "wtyczka telemetrii",
    jak: "Jak zacząć", wersja: "wersja", uac: "Potwierdź okienko Windows (Tak). Stan odświeży się za chwilę.",
    kroki: ["Zainstaluj wtyczkę telemetrii w grze (przycisk obok). Przy pierwszym starcie gra zapyta o zaawansowane SDK: wybierz OK.",
            "Dodaj regułę zapory, jeśli telefon ma łączyć się przez Wi-Fi.",
            "Zeskanuj kod QR. W przeglądarce telefonu dodaj stronę do ekranu głównego, wtedy otwiera się jak aplikacja.",
            "Uruchom grę. Panel sam przełączy się na ETS 2 albo ATS.",
            "Przyciski działają, gdy okno gry jest aktywne na komputerze."],
  },
  en: {
    zeskanuj: "Scan with your phone", ta_sama_siec: "Your phone or tablet must be on the same Wi-Fi network as this PC.",
    usb: "Over USB (USB debugging enabled):", przygotowanie: "Setup", zapora: "Windows Firewall",
    zapora_opis: "Lets your phone in from the home network. Without it Windows often blocks the connection.",
    jest: "ready", brak: "missing", dodaj: "Add rule", zainstaluj: "Install", nie_ma_gry: "not found", wtyczka: "telemetry plugin",
    jak: "Getting started", wersja: "version", uac: "Confirm the Windows prompt (Yes). Status will refresh in a moment.",
    kroki: ["Install the telemetry plugin for your game (button on the left). On first launch the game asks about the advanced SDK: choose OK.",
            "Add the firewall rule if your phone connects over Wi-Fi.",
            "Scan the QR code. In your phone's browser add the page to the home screen so it opens like an app.",
            "Start the game. The panel switches to ETS 2 or ATS by itself.",
            "Buttons work while the game window is active on the PC."],
  },
};
let jezyk = (() => { try { return localStorage.getItem("jezyk"); } catch (e) { return null; } })() || ((navigator.language || "").startsWith("pl") ? "pl" : "en");
const t = (k) => TEKSTY[jezyk][k];
const $ = (id) => document.getElementById(id);
let info = null;

function rysuj() {
  document.documentElement.lang = jezyk;
  for (const b of $("jezyki").children) b.classList.toggle("aktywna", b.dataset.j === jezyk);
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  $("kroki").innerHTML = t("kroki").map(k => `<li>${k}</li>`).join("");
  if (!info) return;
  $("adres").textContent = info.adres; $("port").textContent = info.port; $("wersja").textContent = `${t("wersja")} ${info.wersja}`;
  const qr = qrcode(0, "M"); qr.addData(info.adres); qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  $("gry").innerHTML = Object.entries(info.gry).map(([k, g]) => `
    <div class="wiersz"><div class="nazwa"><b>${g.nazwa}</b><div class="male">${t("wtyczka")}</div></div>
    ${!g.katalog ? `<span class="znacznik szare">${t("nie_ma_gry")}</span>`
      : g.wtyczka ? `<span class="znacznik ok">${t("jest")}</span>`
      : `<button class="akcja" data-gra="${k}">${t("zainstaluj")}</button>`}</div>`).join("");
  for (const b of $("gry").querySelectorAll("button[data-gra]")) b.onclick = () => wtyczka(b.dataset.gra, b);
  $("zapora").innerHTML = info.zapora ? `<span class="znacznik ok">${t("jest")}</span>` : `<button class="akcja" id="zapora-btn">${t("dodaj")}</button>`;
  if (!info.zapora) $("zapora-btn").onclick = zapora;
}

async function odswiez() { try { info = await (await fetch("/info")).json(); } catch (e) {} rysuj(); }
async function wtyczka(gra, btn) {
  btn.disabled = true;
  const r = await (await fetch("/wtyczka", { method: "POST", body: JSON.stringify({ gra }) })).json();
  $("komunikat").textContent = r.ok ? "" : r.blad;
  odswiez();
}
async function zapora() {
  await fetch("/zapora", { method: "POST", body: "{}" });
  $("komunikat").textContent = t("uac");
  setTimeout(odswiez, 4000); setTimeout(odswiez, 10000);
}
for (const b of $("jezyki").children) b.onclick = () => { jezyk = b.dataset.j; try { localStorage.setItem("jezyk", jezyk); } catch (e) {} rysuj(); };
odswiez(); setInterval(odswiez, 5000);
</script>
</body>
</html>
